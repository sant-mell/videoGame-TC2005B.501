<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Fool's Descent</title>
    <link rel="stylesheet" href="welcome.css">
</head>
<body>

    <audio id="menuMusic" src="../../assets/audio/home_screen.mp3" loop></audio>

    <div class="background-glow"></div>

    <div class="landing-container">

        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <img src="logo.png" alt="The Fool's Descent Logo" class="logo">

        <a href="mainmenu.html">
            <button class="play-button">PLAY</button>
        </a>

    </div>
    <script>
        const menuMusic = document.getElementById("menuMusic");
        menuMusic.volume = 0.3;
    
        window.addEventListener("click", () => {
            if (menuMusic.paused) {
                menuMusic.play().catch(() => {
                    console.log("Menu music waiting for user interaction");
                });
            }
        });
    </script>

</body>
</html>
