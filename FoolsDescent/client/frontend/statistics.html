<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics | The Fool's Descent</title>
    <link rel="stylesheet" href="statistics.css">
</head>
<body>

    <div class="statistics-container">

        <h1 class="title">STATISTICS</h1>

        <div class="content-container">

            <div class="stats-panel">
                <h2 class="panel-title">YOUR DESCENT</h2>
                <ul class="stats-list">
                    <li><span>Total Play Time</span><span id="personalPlayTime">-</span></li>
                    <li><span>Deaths</span><span id="personalDeaths">-</span></li>
                    <li><span>Enemies Defeated</span><span id="personalEnemies">-</span></li>
                    <li><span>Victories</span><span id="personalVictories">-</span></li>
                    <li><span>Coins Earned</span><span id="personalCoins">-</span></li>
                    <li><span>Cards Played</span><span id="personalCards">-</span></li>
                </ul>
            </div>

            <div class="stats-panel">
                <h2 class="panel-title">ALL PLAYERS</h2>
                <ul class="stats-list">
                    <li><span>Total Players</span><span id="globalPlayers">-</span></li>
                    <li><span>Average Play Time</span><span id="globalPlayTime">-</span></li>
                    <li><span>Average Deaths</span><span id="globalDeaths">-</span></li>
                    <li><span>Total Enemies Defeated</span><span id="globalEnemies">-</span></li>
                    <li><span>Average Victories</span><span id="globalVictories">-</span></li>
                    <li><span>Total Coins</span><span id="globalCoins">-</span></li>
                    <li><span>Total Cards Played</span><span id="globalCards">-</span></li>
                </ul>
            </div>

        </div>

        <a href="menu.html"><button class="back-button">BACK</button></a>

    </div>

    <script src="../scripts/statistics.js"></script>

</body>
</html>
