<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | The Fool's Descent</title>
    <link rel="stylesheet" href="createaccount.css">
</head>
<body>

    <div class="register-container">

        <h1 class="title">CREATE ACCOUNT</h1>

        <form class="register-form">

            <input type="text" id="fullName" placeholder="Full Name" aria-label="Full Name">

            <input type="text" id="username" placeholder="Username" aria-label="Username">

            <input type="password" id="password" placeholder="Password" aria-label="Password">

            <input type="number" id="age" placeholder="Age" min="0" aria-label="Age">

            <select id="gender" aria-label="Gender">
                <option selected disabled>Gender</option>
                <option>Female</option>
                <option>Male</option>
                <option>Other</option>
            </select>

            <button type="submit">CREATE ACCOUNT</button>
            <a href="mainmenu.html"><button type="button" class="back-button">BACK</button></a>

        </form>

    </div>
    <script src="../scripts/createaccount.js"></script>
</body>
</html>
